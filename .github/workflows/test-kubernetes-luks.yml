name: Kubernetes LUKS example

# Exercises the kubernetes/examples/encryption-at-rest-luks/ adoption flow:
#   1. Bring up the default stack via the shared composite action.
#   2. Follow the example's README step-by-step (scale down → format LUKS →
#      migrate plaintext sites/ into the encrypted FS → swap the openemr
#      Deployment for the LUKS variant → wait Ready).
#   3. Prove openemr functions atop the encrypted mount (HTTP response +
#      unit tests).
#   4. Prove encryption is actually effective (validate-encryption.sh).
#
# Trigger paths cover the example itself plus files it depends on: the
# default openemr Deployment (the LUKS variant is a modified copy), the
# NFS stack it layers over, the kub-up script that the composite action
# runs, and the composite action itself.

on:
  push:
    branches: [master]
    paths:
      - 'kubernetes/examples/encryption-at-rest-luks/**'
      - 'kubernetes/openemr/deployment.yaml'
      - 'kubernetes/nfs/**'
      - 'kubernetes/certs/**'
      - 'kubernetes/redis/**'
      - 'kubernetes/rotate-ca'
      - 'kubernetes/trust-manager/**'
      - 'kubernetes/kub-up'
      - '.github/actions/kubernetes-stack-up/**'
      - '.github/workflows/test-kubernetes-luks.yml'
      - 'tests/kubernetes/**'
  pull_request:
    branches: [master]
    paths:
      - 'kubernetes/examples/encryption-at-rest-luks/**'
      - 'kubernetes/openemr/deployment.yaml'
      - 'kubernetes/nfs/**'
      - 'kubernetes/certs/**'
      - 'kubernetes/redis/**'
      - 'kubernetes/rotate-ca'
      - 'kubernetes/trust-manager/**'
      - 'kubernetes/kub-up'
      - '.github/actions/kubernetes-stack-up/**'
      - '.github/workflows/test-kubernetes-luks.yml'
      - 'tests/kubernetes/**'
  workflow_dispatch:

jobs:
  luks-example-test:
    name: LUKS example adoption + validation
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Bring up OpenEMR default stack
        uses: ./.github/actions/kubernetes-stack-up

      - name: Scale openemr + phpmyadmin to 0 (quiesce writes before format)
        run: |
          kubectl scale deployment openemr phpmyadmin --replicas=0
          kubectl wait --for=delete pod -l name=openemr --timeout=120s
          kubectl wait --for=delete pod -l name=phpmyadmin --timeout=120s

      - name: Create real LUKS passphrase Secret (bypass placeholder gate)
        run: |
          # openssl rand -base64 48 → 64 chars of base64, well above any
          # sensible entropy minimum. Does not match the committed
          # placeholder, so the format Job's placeholder-check lets this
          # through.
          kubectl create secret generic luks-passphrase \
            --from-literal=passphrase="$(openssl rand -base64 48)" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run LUKS format Job
        run: |
          kubectl apply -f kubernetes/examples/encryption-at-rest-luks/luks-format-job.yaml
          kubectl wait --for=condition=complete job/luks-format-websitevolume --timeout=600s
          echo "--- format Job logs ---"
          kubectl logs job/luks-format-websitevolume

      - name: Run plaintext → encrypted migration helper
        # NOTE: the alpine image digest below is inline in a kubectl
        # pod spec (heredoc), which dependabot's docker ecosystem
        # does NOT scan — it only scans top-level `image:` fields
        # in Kubernetes YAML and Dockerfiles, not inline pod specs
        # in GHA workflow shell steps. Keep this digest in sync with
        # the kubernetes/nfs/ + kubernetes/examples/
        # encryption-at-rest-luks/ pins when dependabot's
        # "infrastructure" group bumps those.
        run: |
          # Exercises the migration step the example README documents
          # (step 3b): rsync the plaintext sites/ contents already on
          # websitevolume into the newly-formatted LUKS filesystem, so
          # the LUKS-variant openemr pod sees existing config
          # (sqlconf.php, demo seed, etc.) instead of boot-strapping
          # from scratch.
          cat <<'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: luks-migrate-helper
          spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            containers:
            - name: migrate
              image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  apk add --no-cache cryptsetup e2fsprogs util-linux rsync
                  cryptsetup luksOpen --key-file /etc/luks/passphrase \
                    /mnt/websitevolume/.openemr-sites.luks openemr-sites-migrate
                  mkdir -p /dec
                  mount /dev/mapper/openemr-sites-migrate /dec
                  rsync -aHAX --exclude=.openemr-sites.luks \
                    /mnt/websitevolume/ /dec/
                  sync
                  umount /dec
                  cryptsetup luksClose openemr-sites-migrate
                  echo "MIGRATION_OK"
              securityContext:
                privileged: true
              volumeMounts:
                - name: websitevolume
                  mountPath: /mnt/websitevolume
                - name: luks-passphrase
                  mountPath: /etc/luks
                  readOnly: true
            volumes:
              - name: websitevolume
                persistentVolumeClaim:
                  claimName: websitevolume
              - name: luks-passphrase
                secret:
                  secretName: luks-passphrase
                  defaultMode: 0400
                  items:
                    - key: passphrase
                      path: passphrase
          EOF
          # Poll until the helper's phase is terminal (Succeeded or Failed).
          for _ in $(seq 1 60); do
            PHASE=$(kubectl get pod luks-migrate-helper -o jsonpath='{.status.phase}' 2>/dev/null || echo Unknown)
            case "$PHASE" in
              Succeeded|Failed) break ;;
            esac
            sleep 5
          done
          echo "--- migration helper logs ---"
          kubectl logs luks-migrate-helper
          PHASE=$(kubectl get pod luks-migrate-helper -o jsonpath='{.status.phase}')
          kubectl delete pod luks-migrate-helper --wait=false
          if [ "$PHASE" != "Succeeded" ]; then
            echo "ERROR: migration helper exited with phase $PHASE"
            exit 1
          fi

      - name: Swap openemr Deployment for the LUKS variant
        run: |
          # kubectl replace (not apply) because the Deployment name is
          # the same but the spec differs significantly (replicas, strategy,
          # sidecar, mount topology). Replace tears down the old one
          # first — safe here because we scaled to 0 above.
          kubectl replace -f kubernetes/examples/encryption-at-rest-luks/openemr-deployment-luks.yaml
          echo "Waiting for LUKS-variant openemr pod to reach Ready..."
          kubectl wait --for=condition=Ready -l name=openemr pod --timeout=1200s

      - name: Verify all pods running
        run: |
          kubectl get pods
          NOT_RUNNING=$(kubectl get pods --no-headers | grep -v Running | grep -v Completed || true)
          if [ -n "$NOT_RUNNING" ]; then
            echo "ERROR: Some pods are not running:"
            echo "$NOT_RUNNING"
            exit 1
          fi
          echo "PASS: All pods running"

      - name: Test OpenEMR HTTP response (atop LUKS)
        run: |
          kubectl port-forward service/openemr 8080:8080 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT

          # Poll until the port-forward tunnel is live rather than relying
          # on a fixed sleep. 30 × 1s = 30s cap covers startup jitter;
          # typical delay is <3s. Use curl's exit code (not its printed
          # body) as the "tunnel live" signal — curl writes "000" to
          # stdout on connection failure, so `curl ... || echo "000"`
          # would append "000" to that "000" and produce the bogus
          # HTTP_CODE "000000" on the first attempt, which is != "000"
          # and would break out of the loop prematurely.
          HTTP_CODE="000"
          for _ in $(seq 1 30); do
            if CURL_OUT=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 2>/dev/null); then
              HTTP_CODE="$CURL_OUT"
              break
            fi
            sleep 1
          done

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: OpenEMR returned HTTP $HTTP_CODE atop LUKS"
            exit 1
          fi
          echo "PASS: OpenEMR HTTP responding atop LUKS (status $HTTP_CODE)"

      - name: Get openemr pod name
        id: openemr-pod
        run: |
          POD=$(kubectl get pods -l name=openemr -o jsonpath='{.items[0].metadata.name}')
          echo "pod=$POD" >> "$GITHUB_OUTPUT"
          echo "Using OpenEMR pod: $POD"

      - name: Initialize OpenEMR database
        timeout-minutes: 2
        run: |
          # See test-kubernetes.yml for rationale — exec via openemr
          # pod with its mysql-openemr-client cert, target mysql-primary.
          kubectl exec deploy/openemr -- bash -c '
            mariadb -h mysql-primary -u root -p"$MYSQL_ROOT_PASS" \
              --ssl-ca=/root/certs/mysql/server/mysql-ca \
              --ssl-cert=/root/certs/mysql/server/mysql-cert \
              --ssl-key=/root/certs/mysql/server/mysql-key \
              -e "
                INSERT INTO product_registration (opt_out) VALUES (1);
                UPDATE globals SET gl_value = 1 WHERE gl_name = \"rest_api\";
                UPDATE globals SET gl_value = 1 WHERE gl_name = \"rest_fhir_api\";
                UPDATE globals SET gl_value = 1 WHERE gl_name = \"rest_portal_api\";
                UPDATE globals SET gl_value = 3 WHERE gl_name = \"oauth_password_grant\";
                UPDATE globals SET gl_value = 1 WHERE gl_name = \"rest_system_scopes_api\";
              " openemr
          '

      - name: Install dev dependencies (atop LUKS)
        timeout-minutes: 5
        run: |
          kubectl exec ${{ steps.openemr-pod.outputs.pod }} -- \
            sh -c 'cd /var/www/localhost/htdocs/openemr && composer install --dev --no-interaction --optimize-autoloader --ignore-platform-reqs'

      - name: Unit tests (atop LUKS)
        timeout-minutes: 5
        run: |
          kubectl get pod ${{ steps.openemr-pod.outputs.pod }} -o jsonpath='{.status.phase}' && echo ""
          kubectl exec ${{ steps.openemr-pod.outputs.pod }} -- \
            sh -c 'cd /var/www/localhost/htdocs/openemr && php -d memory_limit=8G ./vendor/bin/phpunit --colors=always --testdox --stop-on-failure --testsuite unit'

      - name: Validate LUKS encryption effectiveness
        run: bash kubernetes/examples/encryption-at-rest-luks/validate-encryption.sh

      - name: Scale phpmyadmin back up
        # Scaled to 0 above only to stop writes during the migration (the
        # example's adoption procedure leaves it running). The rotations
        # below restart it and check its trust file.
        run: |
          kubectl scale deployment phpmyadmin --replicas=1
          kubectl rollout status deployment/phpmyadmin --timeout=600s

      - name: Install cmctl (cert-manager CLI)
        run: |
          sudo curl -fL -o /usr/local/bin/cmctl \
            https://github.com/cert-manager/cmctl/releases/download/v2.6.2/cmctl_linux_amd64
          sudo chmod +x /usr/local/bin/cmctl
          cmctl version --client
          echo "ROTATION_WORKDIR=${RUNNER_TEMP}/cert-rotation" >> "${GITHUB_ENV}"

      # Certificate rotation with the encrypted sites volume: OpenEMR's own
      # client certificates (restart the openemr pods) and the NFS server
      # certificate (pauses NFS I/O under the encrypted layer). The other
      # leaves behave as in the default stack (test-kubernetes-cert-rotation.yml).
      # Budgets: see the README's data-plane impact list.
      - name: Rotate openemr -> MariaDB client certificate
        run: |
          bash tests/kubernetes/rotate-leaf.sh mysql-openemr-client deployment/openemr --max-gap 60 \
            --pod-file /root/certs/mysql/server/mysql-cert \
            --openemr-file /var/www/localhost/htdocs/openemr/sites/default/documents/certificates/mysql-cert

      - name: Rotate openemr -> Redis client certificate
        run: |
          bash tests/kubernetes/rotate-leaf.sh redis-openemr-client deployment/openemr --max-gap 60 \
            --pod-file /redis-certs/redis-master-cert \
            --pod-file /redis-certs/redis-sentinel-cert

      - name: Rotate NFS server certificate
        run: |
          bash tests/kubernetes/rotate-leaf.sh nfs-server deployment/nfs-server --max-gap 60 \
            --served-via-openemr nfs-server:20490

      - name: Rotate the CA key
        # Every OpenEMR restart is a full outage here (one replica,
        # Recreate), and rotate-ca restarts OpenEMR four times (steps 3 and
        # 5, and its two client certificates in step 4). Measured locally
        # on 2026-11-12: 648s, longest gap 44s (mysql/nfs), 32s (http).
        run: bash tests/kubernetes/rotate-ca-test.sh --max-gap 120

      - name: Validate LUKS encryption effectiveness after the rotations
        run: bash kubernetes/examples/encryption-at-rest-luks/validate-encryption.sh

      - name: Probe logs
        if: always()
        run: |
          for f in "${ROTATION_WORKDIR:-/nonexistent}"/*/*.log; do
            [[ -f "${f}" ]] || continue
            echo "=== ${f#"${ROTATION_WORKDIR}"/}"
            cat "${f}"
          done

      - name: Collect debug info on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -o wide
          echo "=== Events ==="
          kubectl get events --sort-by='.lastTimestamp' | tail -40
          echo "=== OpenEMR (main container) Logs ==="
          kubectl logs -l name=openemr -c openemr --tail=100 2>/dev/null || true
          OPENEMR_POD=$(kubectl get pod -l name=openemr -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$OPENEMR_POD" ]; then
            echo "=== luks-opener sidecar logs ==="
            kubectl logs "$OPENEMR_POD" -c luks-opener --tail=100 2>/dev/null || true
          fi
          echo "=== nfs-server (ganesha) logs ==="
          NFS_POD=$(kubectl get pod -l app=nfs-server -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$NFS_POD" ]; then
            kubectl logs "$NFS_POD" -c nfs-server 2>/dev/null || true
          fi
          echo "=== luks-format Job logs ==="
          kubectl logs job/luks-format-websitevolume 2>/dev/null || true
          echo "=== luks-migrate-helper logs (if still present) ==="
          kubectl logs luks-migrate-helper 2>/dev/null || true

      - name: Cleanup
        if: always()
        # Bounded so a hung teardown (kub-down waiting on a stuck NFS or
        # FUSE mount) fails this step instead of running into the job
        # timeout, which cancels the run and discards its logs.
        timeout-minutes: 10
        working-directory: kubernetes
        run: |
          timeout 300 bash kub-down 2>/dev/null || true
          kind delete cluster 2>/dev/null || true
