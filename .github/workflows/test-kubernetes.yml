name: Kubernetes Integration Test

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/test-kubernetes.yml'
      - '.github/actions/kubernetes-stack-up/**'
      - 'kubernetes/**'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/test-kubernetes.yml'
      - '.github/actions/kubernetes-stack-up/**'
      - 'kubernetes/**'
  workflow_dispatch:

jobs:
  kubernetes-test:
    name: Kubernetes mTLS + Sentinel + Replication
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Bring up OpenEMR default stack
        uses: ./.github/actions/kubernetes-stack-up

      - name: Verify all pods running
        run: |
          kubectl get pods
          NOT_RUNNING=$(kubectl get pods --no-headers | grep -v Running | grep -v Completed || true)
          if [ -n "$NOT_RUNNING" ]; then
            echo "ERROR: Some pods are not running:"
            echo "$NOT_RUNNING"
            exit 1
          fi
          echo "PASS: All pods running"

      - name: Test OpenEMR HTTP response
        run: |
          # Port-forward in background
          kubectl port-forward service/openemr 8080:8080 &
          PF_PID=$!
          sleep 3
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || echo "000")
          kill $PF_PID 2>/dev/null || true
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: OpenEMR returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "PASS: OpenEMR HTTP responding (status $HTTP_CODE)"

      - name: Test phpMyAdmin HTTP response
        run: |
          kubectl port-forward service/phpmyadmin 8081:8081 &
          PF_PID=$!
          sleep 3
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081 || echo "000")
          kill $PF_PID 2>/dev/null || true
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: phpMyAdmin returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "PASS: phpMyAdmin HTTP responding (status $HTTP_CODE)"

      - name: Test MariaDB replication (operator-managed)
        run: |
          # The MariaDB Operator's own Ready condition covers the
          # full replication story: StatefulSet rolled out, primary
          # pod running, replica caught up, semi-sync set up, certs
          # provisioned. The composite action already waited on this
          # before running any test step — this just surfaces the
          # operator's status subresource for log auditability and
          # fails loud if it ever drifts out of Ready between setup
          # and this step.
          echo "--- MariaDB resource status ---"
          kubectl get mariadb mysql -o wide
          echo ""
          echo "--- Status conditions ---"
          kubectl get mariadb mysql -o jsonpath='{range .status.conditions[*]}{.type}={.status} reason={.reason} message={.message}{"\n"}{end}'
          READY=$(kubectl get mariadb mysql -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
          if [ "$READY" != "True" ]; then
            echo "ERROR: MariaDB resource not Ready — operator considers the cluster degraded"
            kubectl describe mariadb mysql | tail -40
            exit 1
          fi
          echo "PASS: MariaDB operator reports Ready (replication + semi-sync healthy)"

      - name: Test NFS shared volume across pods
        run: |
          POD1=$(kubectl get pods -l name=openemr -o jsonpath='{.items[0].metadata.name}')
          POD2=$(kubectl get pods -l name=openemr -o jsonpath='{.items[1].metadata.name}')
          echo "Writing from $POD1, reading from $POD2"
          kubectl exec "$POD1" -- sh -c 'echo "shared-volume-test" > /var/www/localhost/htdocs/openemr/sites/nfs-test.txt'
          RESULT=$(kubectl exec "$POD2" -- cat /var/www/localhost/htdocs/openemr/sites/nfs-test.txt 2>/dev/null)
          kubectl exec "$POD1" -- rm -f /var/www/localhost/htdocs/openemr/sites/nfs-test.txt
          if [ "$RESULT" != "shared-volume-test" ]; then
            echo "ERROR: NFS shared volume not working (pod2 got: $RESULT)"
            exit 1
          fi
          echo "PASS: NFS shared volume verified across pods ($POD1 -> $POD2)"

      - name: Verify Redis rejects plain TCP connections
        run: |
          if kubectl exec redis-0 -- redis-cli -h redis-0.redis -p 6379 -a adminpassword ping 2>&1 | grep -q "PONG"; then
            echo "ERROR: Redis accepted plain TCP connection — mTLS not enforced"
            exit 1
          fi
          echo "PASS: Redis correctly rejected plain TCP connection"

      - name: Verify Redis rejects TLS without client cert
        run: |
          if kubectl exec redis-0 -- redis-cli --tls --cacert /certs/ca.crt -h redis-0.redis -p 6379 -a adminpassword ping 2>&1 | grep -q "PONG"; then
            echo "ERROR: Redis accepted TLS without client cert — mTLS not enforced"
            exit 1
          fi
          echo "PASS: Redis correctly rejected TLS connection without client cert"

      - name: Verify Redis accepts mTLS connection
        run: |
          RESULT=$(kubectl exec redis-0 -- redis-cli --tls --cacert /certs/ca.crt --cert /certs/tls.crt --key /certs/tls.key -h redis-0.redis -p 6379 --user admin -a adminpassword ping 2>/dev/null | tr -d '\r')
          if [ "$RESULT" != "PONG" ]; then
            echo "ERROR: Redis rejected mTLS connection (got: $RESULT)"
            exit 1
          fi
          echo "PASS: Redis accepted mTLS connection"

      - name: Verify MySQL rejects connections without client cert
        run: |
          # openemr user has REQUIRE X509 (set by openemr's own
          # first-boot grant — look for FORCE_DATABASE_X509_CONNECT=1
          # env in openemr/deployment.yaml). Exec from the mysql
          # primary pod to the mysql-primary Service without
          # presenting any client cert; server must refuse. mysql-0
          # has mariadb-client in its image but no client-cert mount
          # in a way that would accidentally present one for this
          # Service connection, so this is a clean negative test.
          #
          # Any output matching "^1$" would mean X509 was NOT
          # enforced. Reject any stderr that includes successful
          # exit codes too — some mariadb-client builds swallow
          # errors by default.
          if kubectl exec mysql-0 -- mariadb -h mysql-primary -u openemr -popenemr -e "SELECT 1" 2>&1 | grep -q "^1$"; then
            echo "ERROR: MySQL accepted connection without client cert — X509 not enforced"
            exit 1
          fi
          echo "PASS: MySQL correctly rejected connection without client cert (X509 enforced)"

      - name: Get OpenEMR pod name
        id: openemr-pod
        run: |
          POD=$(kubectl get pods -l name=openemr -o jsonpath='{.items[0].metadata.name}')
          echo "pod=$POD" >> "$GITHUB_OUTPUT"
          echo "Using OpenEMR pod: $POD"

      - name: Initialize OpenEMR database
        timeout-minutes: 2
        run: |
          # Exec via the openemr pod, which has:
          #   - MYSQL_ROOT_PASS env (same mysql-credentials Secret the
          #     operator reads root pw from — single source of truth)
          #   - mysql-openemr-client cert mounted at
          #     /root/certs/mysql/server/mysql-{ca,cert,key} (the pod's
          #     mTLS identity)
          # Target the operator-managed primary Service `mysql-primary`.
          kubectl exec deploy/openemr -- bash -c '
            mariadb -h mysql-primary -u root -p"$MYSQL_ROOT_PASS" \
              --ssl-ca=/root/certs/mysql/server/mysql-ca \
              --ssl-cert=/root/certs/mysql/server/mysql-cert \
              --ssl-key=/root/certs/mysql/server/mysql-key \
              -e "
                INSERT INTO product_registration (opt_out) VALUES (1);
                UPDATE globals SET gl_value = 1 WHERE gl_name = \"rest_api\";
                UPDATE globals SET gl_value = 1 WHERE gl_name = \"rest_fhir_api\";
                UPDATE globals SET gl_value = 1 WHERE gl_name = \"rest_portal_api\";
                UPDATE globals SET gl_value = 3 WHERE gl_name = \"oauth_password_grant\";
                UPDATE globals SET gl_value = 1 WHERE gl_name = \"rest_system_scopes_api\";
              " openemr
          '

      - name: Install dev dependencies
        timeout-minutes: 5
        run: |
          kubectl exec ${{ steps.openemr-pod.outputs.pod }} -- \
            sh -c 'cd /var/www/localhost/htdocs/openemr && composer install --dev --no-interaction --optimize-autoloader --ignore-platform-reqs'

      - name: Unit tests
        timeout-minutes: 5
        run: |
          kubectl get pod ${{ steps.openemr-pod.outputs.pod }} -o jsonpath='{.status.phase}' && echo ""
          kubectl exec ${{ steps.openemr-pod.outputs.pod }} -- \
            sh -c 'cd /var/www/localhost/htdocs/openemr && php -d memory_limit=8G ./vendor/bin/phpunit --colors=always --testdox --stop-on-failure --testsuite unit'

      - name: Fixtures tests
        timeout-minutes: 5
        run: |
          kubectl get pod ${{ steps.openemr-pod.outputs.pod }} -o jsonpath='{.status.phase}' && echo ""
          kubectl exec ${{ steps.openemr-pod.outputs.pod }} -- \
            sh -c 'cd /var/www/localhost/htdocs/openemr && php -d memory_limit=8G ./vendor/bin/phpunit --colors=always --testdox --stop-on-failure --testsuite fixtures'

      - name: Validators tests
        timeout-minutes: 5
        run: |
          kubectl get pod ${{ steps.openemr-pod.outputs.pod }} -o jsonpath='{.status.phase}' && echo ""
          kubectl exec ${{ steps.openemr-pod.outputs.pod }} -- \
            sh -c 'cd /var/www/localhost/htdocs/openemr && php -d memory_limit=8G ./vendor/bin/phpunit --colors=always --testdox --stop-on-failure --testsuite validators'

      - name: Controllers tests
        timeout-minutes: 5
        run: |
          kubectl get pod ${{ steps.openemr-pod.outputs.pod }} -o jsonpath='{.status.phase}' && echo ""
          kubectl exec ${{ steps.openemr-pod.outputs.pod }} -- \
            sh -c 'cd /var/www/localhost/htdocs/openemr && php -d memory_limit=8G ./vendor/bin/phpunit --colors=always --testdox --stop-on-failure --testsuite common'

      - name: Common tests
        timeout-minutes: 5
        run: |
          kubectl get pod ${{ steps.openemr-pod.outputs.pod }} -o jsonpath='{.status.phase}' && echo ""
          kubectl exec ${{ steps.openemr-pod.outputs.pod }} -- \
            sh -c 'cd /var/www/localhost/htdocs/openemr && php -d memory_limit=8G ./vendor/bin/phpunit --colors=always --testdox --stop-on-failure --testsuite controllers'

      # Services is run last because the CCDA validation test spawns a background
      # Node.js HTTP server (port 6662) that outlives phpunit. The orphaned process
      # keeps the kubectl exec session open, blocking subsequent kubectl exec calls.
      # We wrap the exec in timeout so the CI step completes even if kubectl hangs.
      - name: Services tests
        timeout-minutes: 5
        run: |
          kubectl get pod ${{ steps.openemr-pod.outputs.pod }} -o jsonpath='{.status.phase}' && echo ""
          timeout 180 kubectl exec ${{ steps.openemr-pod.outputs.pod }} -- \
            sh -c 'cd /var/www/localhost/htdocs/openemr && php -d memory_limit=8G ./vendor/bin/phpunit --colors=always --testdox --stop-on-failure --testsuite services' || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 124 ]; then
              echo "kubectl exec timed out (expected — CCDA Node.js server keeps session open)"
              echo "Services tests completed successfully before timeout"
            else
              exit $EXIT_CODE
            fi
          }

      - name: Verify cert rotation triggers workload reload and preserves data plane
        timeout-minutes: 15
        run: |
          # End-to-end proof of the certificate reload mechanism under
          # the MariaDB Operator topology:
          #  (1) force cert-manager to re-issue the operator-managed
          #      server Certificate via cmctl renew -- updates the
          #      Secret in place (not DELETE+CREATE), which is the
          #      event shape the operator's cert-controller reacts to.
          #  (2) assert the Secret fingerprint changes (cert-manager
          #      re-issue path succeeded end-to-end).
          #  (3) assert the operator rolls its own StatefulSet. The
          #      operator orchestrates: (a) promote replica to primary
          #      BEFORE terminating the old primary, (b) update the
          #      mysql-primary Service endpoints to point at the new
          #      primary, (c) fence the demoted pod, (d) bring the
          #      replaced pod back as the new replica. Semi-sync
          #      AfterSync (configured on the MariaDB resource) means
          #      transactions committed on the old primary are durable
          #      at the new primary before the switchover -- no data
          #      loss window.
          #  (4) assert data-plane availability by probing mysql-primary
          #      from openemr through the rotation window. With
          #      operator-orchestrated failover the mysql-primary
          #      Service endpoints stay populated throughout (unlike
          #      the hand-rolled stack where mysql-sts-0 going
          #      Terminating left the Service with no backend). Target
          #      is zero FAIL iterations.
          #  (5) assert the MariaDB resource stays Ready end-to-end
          #      (operator's declarative signal for "replication +
          #      TLS + semi-sync all healthy").

          echo "--- install cmctl (cert-manager CLI) ---"
          sudo curl -fL -o /usr/local/bin/cmctl \
            https://github.com/cert-manager/cmctl/releases/download/v2.6.2/cmctl_linux_amd64
          sudo chmod +x /usr/local/bin/cmctl
          cmctl version --client || true

          echo "--- discover operator-managed server Certificate ---"
          # MariaDB Operator with spec.tls.serverCertIssuerRef creates
          # its own Certificate resource (name+Secret shape depends on
          # operator version). Discover via label (operator typically
          # sets app.kubernetes.io/instance or k8s.mariadb.com/mariadb)
          # OR fall back to name pattern. Fail loud with a full dump
          # if nothing matches, so a subsequent fix has empirical
          # input.
          echo "--- all cert-manager Certificates ---"
          kubectl get certificates -o custom-columns='NAME:.metadata.name,SECRET:.spec.secretName,READY:.status.conditions[?(@.type=="Ready")].status,LABELS:.metadata.labels'
          SERVER_CERT=$(
            kubectl get certificates -o json \
            | jq -r '.items[]
                | select(
                    ((.metadata.labels // {})["app.kubernetes.io/instance"] == "mysql")
                    or ((.metadata.labels // {})["k8s.mariadb.com/mariadb"] == "mysql")
                    or (.metadata.name | test("^mysql-")))
                | select(.spec.secretName | test("server|tls|cert"; "i"))
                | select(.spec.secretName | test("client|openemr|phpmyadmin"; "i") | not)
                | .metadata.name' \
            | head -1
          )
          if [ -z "$SERVER_CERT" ]; then
            echo "FAIL: could not discover operator-managed mysql server Certificate."
            echo "      Manual follow-up needed — inspect the cert list above and"
            echo "      update the SERVER_CERT discovery query in this test."
            exit 1
          fi
          SERVER_SECRET=$(kubectl get certificate "$SERVER_CERT" -o jsonpath='{.spec.secretName}')
          echo "Server Certificate: $SERVER_CERT  (Secret: $SERVER_SECRET)"

          echo "--- record pre-rotation state ---"
          OLD_SHA=$(kubectl get secret "$SERVER_SECRET" -o jsonpath='{.data.tls\.crt}' \
            | base64 -d | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2)
          OLD_GEN=$(kubectl get statefulset mysql -o jsonpath='{.status.observedGeneration}')
          echo "old $SERVER_SECRET fp: $OLD_SHA"
          echo "old mysql StatefulSet observedGeneration: $OLD_GEN"

          echo "--- start background data-plane probe (1 Hz, via mysql-primary) ---"
          # Probe each iteration retries internally up to 3 times
          # (~3s total) before declaring FAIL -- absorbs kube-proxy
          # endpoint-sync microjitter. With operator-orchestrated
          # primary failover, the mysql-primary Service endpoints
          # stay populated throughout cert rotation, so zero FAIL is
          # the legitimate target (unlike the hand-rolled stack where
          # mysql-sts-0 going Terminating left the Service empty).
          rm -f /tmp/probe.log /tmp/probe.stop
          (
            while [ ! -f /tmp/probe.stop ]; do
              ts=$(date +%s)
              success=0
              for _ in 1 2 3; do
                if timeout 5s kubectl exec deploy/openemr -- \
                    mariadb -h mysql-primary -u openemr -popenemr \
                      --ssl-ca=/root/certs/mysql/server/mysql-ca \
                      --ssl-cert=/root/certs/mysql/server/mysql-cert \
                      --ssl-key=/root/certs/mysql/server/mysql-key \
                      -e "SELECT 1" openemr >/dev/null 2>&1; then
                  success=1
                  break
                fi
                sleep 1
              done
              if [ "$success" = "1" ]; then
                echo "$ts OK" >> /tmp/probe.log
              else
                echo "$ts FAIL" >> /tmp/probe.log
              fi
              sleep 1
            done
          ) &
          PROBE_PID=$!

          echo "--- wait for probe baseline (first OK) ---"
          for _ in $(seq 1 30); do
            if grep -q ' OK$' /tmp/probe.log 2>/dev/null; then break; fi
            sleep 1
          done
          if ! grep -q ' OK$' /tmp/probe.log 2>/dev/null; then
            echo "FAIL: probe never reached a successful baseline in 30s"
            tail -20 /tmp/probe.log || true
            touch /tmp/probe.stop ; wait "$PROBE_PID" 2>/dev/null || true
            exit 1
          fi

          echo "--- force cert-manager re-issue via cmctl renew ---"
          cmctl renew "$SERVER_CERT"

          echo "--- wait for Secret UPDATE (new fingerprint) ---"
          for _ in $(seq 1 60); do
            CUR=$(kubectl get secret "$SERVER_SECRET" -o jsonpath='{.data.tls\.crt}' 2>/dev/null \
              | base64 -d 2>/dev/null \
              | openssl x509 -noout -fingerprint -sha256 2>/dev/null \
              | cut -d= -f2)
            if [ -n "$CUR" ] && [ "$CUR" != "$OLD_SHA" ]; then
              NEW_SHA=$CUR
              break
            fi
            sleep 2
          done
          if [ -z "${NEW_SHA:-}" ]; then
            echo "FAIL: cmctl renew did not update $SERVER_SECRET within 120s"
            kubectl describe certificate "$SERVER_CERT"
            touch /tmp/probe.stop ; wait "$PROBE_PID" 2>/dev/null || true
            exit 1
          fi
          echo "PASS: cert rotated ($OLD_SHA -> $NEW_SHA)"

          echo "--- wait for operator to roll the StatefulSet ---"
          # The operator's cert-controller sees the Secret UPDATE and
          # triggers a rolling restart with primary-failover
          # orchestration. StatefulSet observedGeneration advances
          # when the operator mutates the pod template (annotation
          # bump to force pod recreation).
          for _ in $(seq 1 90); do
            NEW_GEN=$(kubectl get statefulset mysql -o jsonpath='{.status.observedGeneration}')
            if [ "${NEW_GEN:-0}" -gt "${OLD_GEN:-0}" ]; then
              break
            fi
            sleep 2
          done
          if [ "${NEW_GEN:-0}" -le "${OLD_GEN:-0}" ]; then
            echo "FAIL: operator did not roll mysql StatefulSet within 180s"
            kubectl logs -n default deployment/mariadb-operator --tail=100
            touch /tmp/probe.stop ; wait "$PROBE_PID" 2>/dev/null || true
            exit 1
          fi
          echo "PASS: mysql StatefulSet rolled (gen $OLD_GEN -> $NEW_GEN)"
          kubectl rollout status statefulset/mysql --timeout=300s

          echo "--- wait for operator to report Ready after rotation ---"
          kubectl wait --for=condition=Ready mariadb/mysql --timeout=120s
          echo "PASS: operator reports Ready post-rotation (replication re-established)"

          echo "--- stop probe + evaluate data-plane availability ---"
          touch /tmp/probe.stop
          wait "$PROBE_PID" 2>/dev/null || true
          OK_COUNT=$(grep -c ' OK$'   /tmp/probe.log || true)
          FAIL_COUNT=$(grep -c ' FAIL$' /tmp/probe.log || true)
          TOTAL=$((OK_COUNT + FAIL_COUNT))
          echo "probe: OK=$OK_COUNT FAIL=$FAIL_COUNT TOTAL=$TOTAL"
          # Operator failover keeps mysql-primary Service endpoints
          # populated throughout; the 3-retry probe absorbs kube-proxy
          # microjitter. Zero FAIL is the real target.
          if [ "$TOTAL" -lt 10 ]; then
            echo "FAIL: probe window too short — expected >=10 iterations, got $TOTAL"
            exit 1
          fi
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "FAIL: data plane experienced sustained outage during rotation ($FAIL_COUNT/$TOTAL iterations)"
            tail -40 /tmp/probe.log
            exit 1
          fi
          echo "PASS: data plane remained uninterrupted through rotation ($OK_COUNT/$TOTAL successes, 0 sustained outages)"

          echo "--- post-rotation openemr -> mysql-primary mTLS smoke ---"
          kubectl exec deploy/openemr -- bash -c '
            mariadb -h mysql-primary -u openemr -popenemr \
              --ssl-ca=/root/certs/mysql/server/mysql-ca \
              --ssl-cert=/root/certs/mysql/server/mysql-cert \
              --ssl-key=/root/certs/mysql/server/mysql-key \
              -e "SHOW STATUS LIKE '\''Ssl_cipher'\''" openemr
          ' | grep -i "TLS_\|ECDHE\|AES" || {
            echo "FAIL: mariadb not answering on mTLS post-rotation"
            exit 1
          }
          echo "PASS: cert rotation end-to-end verified (rotate + reload + zero-downtime failover + mTLS intact)"

      - name: Test Redis Sentinel failover
        run: |
          echo "--- Checking initial master ---"
          ROLE_0=$(kubectl exec redis-0 -- redis-cli --tls --cacert /certs/ca.crt --cert /certs/tls.crt --key /certs/tls.key --user admin -a adminpassword info replication 2>/dev/null | grep "role:" | tr -d '\r')
          echo "redis-0: $ROLE_0"
          echo "--- Deleting redis-0 to trigger failover ---"
          kubectl delete pod redis-0
          echo "--- Waiting for failover ---"
          sleep 15
          echo "--- Checking for new master ---"
          NEW_MASTER=""
          for pod in redis-1 redis-2; do
            ROLE=$(kubectl exec $pod -- redis-cli --tls --cacert /certs/ca.crt --cert /certs/tls.crt --key /certs/tls.key --user admin -a adminpassword info replication 2>/dev/null | grep "role:" | tr -d '\r')
            echo "$pod: $ROLE"
            if echo "$ROLE" | grep -q "master"; then
              NEW_MASTER=$pod
            fi
          done
          if [ -z "$NEW_MASTER" ]; then
            echo "ERROR: No master found after failover"
            kubectl logs sentinel-0 | tail -20
            kubectl logs sentinel-1 | tail -20
            kubectl logs sentinel-2 | tail -20
            exit 1
          fi
          echo "PASS: Redis failover succeeded, new master is $NEW_MASTER"
          echo "--- Checking sentinel logs ---"
          kubectl logs sentinel-0 2>/dev/null | grep failover || true
          kubectl logs sentinel-1 2>/dev/null | grep failover || true
          kubectl logs sentinel-2 2>/dev/null | grep failover || true

      - name: Collect debug info on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -o wide
          echo "=== Events ==="
          kubectl get events --sort-by='.lastTimestamp' | tail -30
          echo "=== OpenEMR Logs ==="
          kubectl logs -l name=openemr --tail=50 2>/dev/null || true
          echo "=== MySQL-0 Logs ==="
          kubectl logs mysql-sts-0 --tail=50 2>/dev/null || true
          echo "=== MySQL-1 Logs ==="
          kubectl logs mysql-sts-1 --tail=50 2>/dev/null || true
          echo "=== Redis-0 Logs ==="
          kubectl logs redis-0 --tail=50 2>/dev/null || true
          echo "=== Sentinel Logs ==="
          kubectl logs sentinel-0 --tail=50 2>/dev/null || true
          # kubectl logs -l selector drops the -c container flag silently
          # — need an explicit pod name. Fetch the nfs-server pod name
          # first, then both containers in turn.
          NFS_POD=$(kubectl get pod -l app=nfs-server -o jsonpath='{.items[0].metadata.name}')
          echo "=== nfs-server (ganesha) logs ==="
          # Dump the whole ganesha log unfiltered — ganesha's Default_Log_Level
          # is INFO, so CRIT/MAJ/WARN/EVENT lines from any component (not just
          # the ones we'd think to grep for) can surface the real failure.
          kubectl logs "$NFS_POD" -c nfs-server 2>/dev/null || true
          echo "=== nfs-server (stunnel) logs ==="
          kubectl logs "$NFS_POD" -c stunnel --tail=20 2>/dev/null || true

      - name: Cleanup
        if: always()
        working-directory: kubernetes
        run: |
          bash kub-down 2>/dev/null || true
          kind delete cluster 2>/dev/null || true
