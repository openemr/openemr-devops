name: Trivy Security Scan
on:
  push:
    branches:
      - master
    paths:
      - 'docker/openemr/8.1.0/**'
      - 'docker/openemr/binary/**'
      - 'docker/openemr/flex/**'
      - '.github/workflows/trivy.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'docker/openemr/8.1.0/**'
      - 'docker/openemr/binary/**'
      - 'docker/openemr/flex/**'
      - '.github/workflows/trivy.yml'
  schedule:
    - cron: '0 3 * * 1'

jobs:
  trivy-scan:
    name: Trivy (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: 8.1.0
            context: docker/openemr/8.1.0
            build-args: ""
          - image: binary
            context: docker/openemr/binary
            build-args: ""
          - image: flex
            context: docker/openemr/flex
            # Keep in sync with ARG defaults in docker/openemr/flex/Dockerfile
            build-args: |
              ALPINE_VERSION=3.22
              PHP_VERSION=8.4
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          tags: openemr-scan:${{ matrix.image }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        id: trivy-table
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: openemr-scan:${{ matrix.image }}
          scanners: vuln
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          # Skip OpenEMR application dependencies (node_modules, vendor, JARs).
          # Those are owned by the app repo; this scan covers OS packages and
          # Dockerfile-layer concerns only.
          skip-dirs: var/www/localhost/htdocs/openemr
          timeout: 15m

      - name: Run Trivy (SARIF upload)
        id: trivy-sarif
        if: ${{ success() || steps.trivy-table.conclusion == 'failure' }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: openemr-scan:${{ matrix.image }}
          scanners: vuln
          format: sarif
          severity: CRITICAL,HIGH
          skip-dirs: var/www/localhost/htdocs/openemr
          timeout: 15m
          output: trivy-results-${{ matrix.image }}.sarif

      - name: Upload SARIF results to GitHub Security
        if: ${{ hashFiles(format('trivy-results-{0}.sarif', matrix.image)) != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
