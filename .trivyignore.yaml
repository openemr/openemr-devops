  # SchemaSpy is a database documentation tool included with OpenEMR.
  # These vulnerabilities are in SchemaSpy's transitive dependencies
  # and must be addressed by updating SchemaSpy in the OpenEMR repo.
  # =========================================================================
  - id: CVE-2023-6378
