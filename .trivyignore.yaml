# Trivy ignore rules for OpenEMR Docker images
# These vulnerabilities come from upstream OpenEMR application dependencies
# and cannot be fixed in the Dockerfiles. They must be addressed in the
# OpenEMR application repository (https://github.com/openemr/openemr).
#
# MAINTENANCE: When a dependency is updated in the upstream OpenEMR repo,
# remove its corresponding entry here so Trivy can verify the fix.
# The weekly scheduled scan (Monday 03:00 UTC) will catch any that
# are still present after removal.

vulnerabilities:
  # =========================================================================
