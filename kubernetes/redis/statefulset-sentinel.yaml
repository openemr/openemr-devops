# Sentinel StatefulSet : Redis High availability with Sentinel on Kubernetes(K8s)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinel
  annotations:
    # stakater/reloader: on any UPDATE to the listed Secret (cert-manager
    # rotation triggers one), roll this StatefulSet so the pods pick up
    # the new certs. See kubernetes/README.md -> Certificate reload mechanism.
    secret.reloader.stakater.com/reload: "sentinel-certs,openemr-ca-bundle"
spec:
  serviceName: sentinel
  replicas: 3
  selector:
    matchLabels:
      app: sentinel
  template:
    metadata:
      labels:
        app: sentinel
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: config
        image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
        command: [ "sh", "-c" ]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: admin-password
        - name: REDIS_DEFAULT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: default-password
        args:
          - |
            # To downgrade to tls (no client certs): change to false
            REDISX509=true
            nodes=redis-0.redis,redis-1.redis,redis-2.redis
            TLSPARAMETERS="--tls --cacert /certs/ca.crt"
            if $REDISX509; then
                TLSPARAMETERS="$TLSPARAMETERS --cert /certs/tls.crt --key /certs/tls.key"
            fi
            export REDISCLI_AUTH="$REDIS_PASSWORD"
            # Find the master to monitor by asking the Redis pods directly.
            # A replica's master_host is not enough: when the master and the
            # Sentinels restart at the same time (a trust-bundle change restarts
            # every workload), the replicas still name the master that just went
            # away. Sentinels that start monitoring it never learn about the
            # replicas or each other (both come from the master), so they never
            # fail over, while the restarted master's init waits for that
            # failover: a deadlock.
            #   1. Use a pod that answers as master; if several do, the one with
            #      the most replicas (a pod that just started empty as master has
            #      none).
            #   2. If only replicas answer, give the old master (or a Sentinel
            #      that is still running) 30 seconds, then promote the replica
            #      with the highest replication offset.
            rinfo() { redis-cli $TLSPARAMETERS --raw -h "$1" --user admin info replication 2>/dev/null | tr -d '\r'; }
            field() { printf '%s\n' "$1" | sed -n "s/^$2://p"; }
            echo "Looking for the Redis master"
            NO_MASTER_SINCE=""
            while true
            do
                MASTER=""
                BEST=-1
                CAND=""
                CAND_OFF=-1
                for i in ${nodes//,/ }
                do
                    info=$(rinfo "$i")
                    role=$(field "$info" role)
                    if [ "$role" == "master" ]; then
                        n=$(field "$info" connected_slaves)
                        if [ "${n:-0}" -gt "$BEST" ]; then BEST=${n:-0}; MASTER=$i; fi
                    elif [ "$role" == "slave" ]; then
                        off=$(field "$info" slave_repl_offset)
                        if [ "${off:-0}" -gt "$CAND_OFF" ]; then CAND_OFF=${off:-0}; CAND=$i; fi
                    fi
                done
                if [ -n "$MASTER" ]; then
                    echo "found master $MASTER ($BEST replicas)"
                    break
                fi
                if [ -z "$CAND" ]; then
                    echo "no Redis pod answers yet, wait 10 seconds before trying again"
                    NO_MASTER_SINCE=""
                    sleep 10
                    continue
                fi
                now=$(date +%s)
                [ -n "$NO_MASTER_SINCE" ] || NO_MASTER_SINCE=$now
                if [ $((now - NO_MASTER_SINCE)) -lt 30 ]; then
                    echo "replicas answer but no master does; waiting before promoting one"
                    sleep 5
                    continue
                fi
                echo "no master for 30 seconds; promoting $CAND (highest replication offset)"
                redis-cli $TLSPARAMETERS -h "$CAND" --user admin replicaof no one
                MASTER=$CAND
                break
            done
            # Point any replica that follows a different (gone) master at this one.
            for i in ${nodes//,/ }
            do
                [ "$i" == "$MASTER" ] && continue
                info=$(rinfo "$i")
                [ "$(field "$info" role)" == "slave" ] || continue
                mh=$(field "$info" master_host)
                if [ "${mh%%.*}" != "${MASTER%%.*}" ]; then
                    echo "$i replicates from $mh; pointing it at $MASTER"
                    redis-cli $TLSPARAMETERS -h "$i" --user admin replicaof "$MASTER" 6379
                fi
            done
            echo "Creating Sentinel configuration file"
            SENTINEL_CONF="tls-port 26379
            port 0
            tls-cert-file /certs/tls.crt
            tls-key-file /certs/tls.key
            tls-ca-cert-file /certs/ca.crt
            tls-replication yes
            requirepass $REDIS_DEFAULT_PASSWORD
            sentinel monitor mymaster $MASTER 6379 2
            sentinel resolve-hostnames yes
            sentinel announce-hostnames yes
            sentinel down-after-milliseconds mymaster 5000
            sentinel failover-timeout mymaster 60000
            sentinel parallel-syncs mymaster 1
            sentinel auth-user mymaster admin
            sentinel auth-pass mymaster $REDIS_PASSWORD"
            if $REDISX509; then
                SENTINEL_CONF="$SENTINEL_CONF
            tls-auth-clients yes"
            else
                SENTINEL_CONF="$SENTINEL_CONF
            tls-auth-clients no"
            fi
            # Stable Sentinel ID per pod. sentinel.conf is regenerated on
            # every start, so without this each restart (cert reload, node
            # drain) gets a new random ID and the other Sentinels keep the
            # old one as a dead peer. Dead peers still count toward the
            # failover-election majority, so after a few restarts no
            # Sentinel can win an election and Redis stops failing over.
            # With a stable ID, peers just pick up the restarted pod's new
            # address.
            MYID=$(printf '%s' "openemr-sentinel-$(hostname)" | sha1sum | cut -c1-40)
            SENTINEL_CONF="$SENTINEL_CONF
            sentinel myid $MYID"
            echo "$SENTINEL_CONF" > /etc/redis/sentinel.conf
            echo "Sentinel configuration written"
        volumeMounts:
        - name: sentinel-certs
          mountPath: /certs/
        - name: redis-config
          mountPath: /etc/redis/
      containers:
      - name: sentinel
        image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
        command: ["redis-sentinel"]
        args: ["/etc/redis/sentinel.conf"]
        ports:
        - containerPort: 26379
          name: sentinel
        livenessProbe:
          tcpSocket:
            port: sentinel
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: sentinel
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: sentinel-certs
          mountPath: /certs/
        - name: redis-config
          mountPath: /etc/redis/
        - name: data
          mountPath: /data
      volumes:
      - name: sentinel-certs
        projected:
          sources:
          # ca.crt (trust anchors) comes from the trust-manager Bundle target
          # (certs/ca-bundle.yaml), not the leaf Secret, so a CA rotation can
          # trust the old and new CA at the same time. See kubernetes/README.md
          # -> CA rotation.
          - secret:
              name: openemr-ca-bundle
              items:
              - key: ca.crt
                path: ca.crt
          - secret:
              name: sentinel-certs
              items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
      - name: redis-config
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Mi