apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
data:
  redis.conf: |
    # Redis High availability with Sentinel on Kubernetes(K8s) configurations
    # -----------------------------------------------------------------------
    
    bind 0.0.0.0
    
    # remove persistence since already supported with support of failover.
    #dbfilename dump.rdb
    #dir /data
    appendonly no
    save ""
    #appendfilename "appendonly.aof"
    
    # Enabled ACL based auth. 
    protected-mode yes
    
    # This is used by the replics nodes to communicate with master to replicate the data.
    # we are using a user called "replication" for this, and the a strong pwd for the same is given in masterauth
    masterauth __REPLICATION_PASSWORD__
    masteruser replication
    
    # this is the second ConfigMap will be mounted to. it has the list of users needed.
    aclfile /conf/acl/users.acl
    
    # tls certs and setting
    tls-cert-file /certs/tls.crt
    tls-key-file /certs/tls.key
    tls-ca-cert-file /certs/ca.crt
    tls-auth-clients yes
    tls-replication yes
    # Redis 8.12+: a replica accepts only a master whose certificate carries
    # one of these names (all in certs/redis.yaml). Without it, replication
    # checks only the CA chain, so any certificate from the shared CA (Sentinel,
    # OpenEMR client, MariaDB, NFS, ...) would be accepted as the master.
    tls-expected-peer-name "redis-0.redis redis-1.redis redis-2.redis"

    # port, each redis nodes will be used (only use tls)
    port 0
    tls-port 6379

    # To downgrade redis connection security:
    #   tls (no client certs): change "tls-auth-clients yes" to "tls-auth-clients no"
    #   tcp (no encryption): remove all tls lines above and change "port 0" to "port 6379" and remove "tls-port 6379"
    # More configurations are optional, if not provided, redis will consider default values ------
    # ------ More details on configuration : https://redis.io/docs/manual/config/ ------