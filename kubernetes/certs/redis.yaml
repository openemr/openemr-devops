apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redis
spec:
  secretName: redis-certs
  duration: 168h # 7d
  renewBefore: 48h # 2d
  isCA: false
  privateKey:
    size: 2048
    algorithm: RSA
    encoding: PKCS1
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  subject:
    organizations:
      - redis
  commonName: redis
  dnsNames:
    - redis-0.redis
    - redis-1.redis
    - redis-2.redis
    - redis-0.redis.default.svc.cluster.local
    - redis-1.redis.default.svc.cluster.local
    - redis-2.redis.default.svc.cluster.local
  issuerRef:
    name: ca-issuer
    kind: Issuer
    group: cert-manager.io
