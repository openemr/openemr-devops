apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nfs-server
spec:
  secretName: nfs-server-certs
  duration: 2160h # 90d
  renewBefore: 720h # 30d
  isCA: false
  privateKey:
    size: 2048
    algorithm: RSA
    encoding: PKCS1
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  subject:
    organizations:
      - nfs-server
  commonName: nfs-server
  dnsNames:
    # Service name the stunnel-client DaemonSet dials.
    - nfs-server
    - nfs-server.default.svc.cluster.local
  issuerRef:
    name: ca-issuer
    kind: Issuer
    group: cert-manager.io
