apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mysql-replication
spec:
  secretName: mysql-replication-certs
  duration: 168h # 7d
  renewBefore: 48h # 2d
  isCA: false
  privateKey:
    size: 2048
    algorithm: RSA
    encoding: PKCS1
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  subject:
    organizations:
      - mysql
  commonName: mysql
  issuerRef:
    name: ca-issuer
    kind: Issuer
    group: cert-manager.io