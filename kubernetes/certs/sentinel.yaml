apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sentinel
spec:
  secretName: sentinel-certs
  duration: 168h # 7d
  renewBefore: 48h # 2d
  isCA: false
  privateKey:
    size: 2048
    algorithm: RSA
    encoding: PKCS1
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  subject:
    organizations:
      - sentinel
  commonName: sentinel
  dnsNames:
    - sentinel-0.sentinel
    - sentinel-1.sentinel
    - sentinel-2.sentinel
    - sentinel-0.sentinel.default.svc.cluster.local
    - sentinel-1.sentinel.default.svc.cluster.local
    - sentinel-2.sentinel.default.svc.cluster.local
  issuerRef:
    name: ca-issuer
    kind: Issuer
    group: cert-manager.io
