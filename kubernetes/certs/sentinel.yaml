apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sentinel
spec:
  secretName: sentinel-certs
  duration: 2160h # 90d
  renewBefore: 720h # 30d
  isCA: false
  privateKey:
    size: 2048
    algorithm: RSA
    encoding: PKCS1
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  subject:
    organizations:
      - sentinel
  commonName: sentinel
  dnsNames:
    - sentinel-0.sentinel
    - sentinel-1.sentinel
    - sentinel-2.sentinel
    - sentinel-0.sentinel.default.svc.cluster.local
    - sentinel-1.sentinel.default.svc.cluster.local
    - sentinel-2.sentinel.default.svc.cluster.local
    # Redis 8.12+ checks the server name on every outbound TLS connection.
    # The redis init container dials the Service name (`-h sentinel`), and
    # in-pod redis-cli calls without -h dial the loopback address.
    - sentinel
    - sentinel.default.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: ca-issuer
    kind: Issuer
    group: cert-manager.io
