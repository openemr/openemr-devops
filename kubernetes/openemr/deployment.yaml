apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: openemr
  name: openemr
  annotations:
    # stakater/reloader: on any UPDATE to the listed Secrets (cert-manager
    # rotation triggers one), roll this Deployment so the pods pick up the
    # new certs. See kubernetes/README.md -> Certificate reload mechanism.
    secret.reloader.stakater.com/reload: "mysql-openemr-client-certs,redis-openemr-client-certs"
spec:
  replicas: 3
  selector:
    matchLabels:
      name: openemr
  strategy:
    # RollingUpdate so cert rotations + any pod roll stay zero-outage
    # from the user's perspective: one pod at a time rotates, Service
    # endpoints always include at least one Ready pod.
    #
    # Historical note: this used `strategy: Recreate` conservatively
    # for first-boot concerns, but openemr's SWARM_MODE leader-election
    # handles multi-replica concurrent boot safely on its own — the
    # gocryptfs example has run `replicas: 3` + `strategy: RollingUpdate`
    # since it shipped, exercising the same leader-election path over
    # mTLS NFS, with CI validation every PR. The openemr container's
    # own startupProbe has a 20-minute failure window specifically to
    # absorb the leader-election race on concurrent boots.
    #
    # maxUnavailable: 0 guarantees at least `replicas - 1` pods stay
    # Ready throughout the rollout — no user-visible dip in capacity.
    # maxSurge: 1 adds one extra pod at a time rather than two, keeping
    # memory pressure predictable on a resource-constrained node (GHA
    # CI runner, small cloud nodes).
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:      
      labels:
        name: openemr
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: init-mysql-wait
        image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ['sh', '-c', "until nc -z mysql-primary 3306; do echo waiting for mysql; sleep 2; done"]
      - name: init-redis-wait
        image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ['sh', '-c', "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"]
      containers:
      - env:
        - name: MYSQL_HOST
          # MariaDB Operator-generated primary Service. Routes to
          # whichever pod is currently the primary; the operator
          # updates endpoints across the primary-failover window,
          # so clients see sub-second reconnect instead of the
          # ~10-30s outage the hand-rolled `mysql` headless-primary
          # selector produced on pod cutover.
          value: "mysql-primary"
        - name: MYSQL_PASS
          valueFrom:
            secretKeyRef:
              name: openemr-credentials
              key: mysql-pass
        - name: MYSQL_ROOT_PASS
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: password
        - name: MYSQL_USER
          value: "openemr"
        - name: OE_PASS
          valueFrom:
            secretKeyRef:
              name: openemr-credentials
              key: admin-pass
        - name: OE_USER
          value: "admin"
        - name: SESSION_STORAGE_MODE
          value: "predis-sentinel"
        - name: REDIS_SENTINELS
          value: "sentinel-0.sentinel|||sentinel-1.sentinel|||sentinel-2.sentinel"
        - name: REDIS_MASTER
          value: "mymaster"
        - name: REDIS_SENTINELS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: default-password
        - name: REDIS_MASTER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: default-password
        - name: REDIS_TLS
          value: "yes"
        - name: REDIS_X509
          value: "yes"
        - name: REDIS_TLS_CERT_KEY_PATH
          value: "/redis-certs"
        # Synchronous Redis replication on every session write via the
        # Redis WAIT command. Requires openemr 8.6.0+ (shipped in
        # openemr/openemr#15220) — the 8.6.0 pin above enforces that.
        # With waitReplicas=1 on a 1-primary+2-replica cluster, each
        # session write blocks until at least 1 replica has ACKed
        # before the request returns, closing the Sentinel-failover
        # window where an un-replicated in-flight session would be
        # lost on primary promotion. Shortfalls (fewer replicas ACK
        # within the timeout) are logged but do not fail the request
        # — WAIT is durability hardening, not a correctness gate.
        # Timeout stays at the default 1000 ms (clamped at 2500 ms
        # by SentinelUtil, strictly below the 3 s socket read
        # timeout so WAIT's reply arrives before the socket tears
        # down).
        - name: REDIS_SESSION_WAIT_REPLICAS
          value: "1"
        # To downgrade redis connection security:
        #   tls (no client certs): remove REDIS_X509 above and remove redis client cert/key volume items below
        #   tcp (no encryption): also remove REDIS_TLS and REDIS_TLS_CERT_KEY_PATH above and remove
        #     the entire redis-openemr-client-certs volume and volumeMount below
        - name: SWARM_MODE
          value: "yes"
        - name: FORCE_DATABASE_X509_CONNECT
          value: "1"
        # To downgrade mysql connection security:
        #   tls (no client certs): change FORCE_DATABASE_X509_CONNECT to FORCE_DATABASE_SSL_CONNECT
        #     and remove mysql cert/key volume mounts below
        #   tcp (no encryption): also remove the env var above and remove mysql ca volume mount below
        image: openemr/openemr:8.6.0@sha256:69099754278dcb34d538e9c33c5d3e255716d73df05c2cf40ee06f247d9c4066
        name: openemr
        ports:
        - containerPort: 80
        - containerPort: 443
        resources:
          limits:
            cpu: 1000m
            memory: 1G
        startupProbe:
          exec:
            command:
            - cat
            - /root/instance-swarm-ready
          periodSeconds: 10
          # 20-minute deadline (120 * 10s). openemr's first-boot runs
          # leader-election through the shared NFS sites volume and
          # on this stack's mTLS-wrapped ganesha backing the per-op
          # latency is enough to push one leader-election cycle
          # (LEADER_TIMEOUT=300s + ~3-5 min of setup) past a 10-min
          # probe deadline when pods race. 20 min gives one pod
          # reliable headroom to complete its cycle; followers see
          # the leader marker and skip straight to their fast path.
          failureThreshold: 120
        readinessProbe:
          exec:
            command:
            - cat
            - /root/instance-swarm-ready
          initialDelaySeconds: 5
          periodSeconds: 30
        livenessProbe:
          tcpSocket:
            port: 443
          periodSeconds: 30
        volumeMounts:
        - mountPath: /root/certs/mysql/server
          name: mysql-openemr-client-certs
        - mountPath: /redis-certs
          name: redis-openemr-client-certs
        - mountPath: /var/www/localhost/htdocs/openemr/sites
          name: websitevolume
        - mountPath: /etc/ssl
          name: sslvolume
        - mountPath: /etc/letsencrypt
          name: letsencryptvolume
      restartPolicy: Always     
      volumes:
      - name: mysql-openemr-client-certs
        secret:
          secretName: mysql-openemr-client-certs
          items:
          - key: ca.crt
            path: mysql-ca
          - key: tls.crt
            path: mysql-cert
          - key: tls.key
            path: mysql-key
      - name: redis-openemr-client-certs
        secret:
          secretName: redis-openemr-client-certs
          items:
          - key: ca.crt
            path: redis-master-ca
          - key: tls.crt
            path: redis-master-cert
          - key: tls.key
            path: redis-master-key
          - key: ca.crt
            path: redis-sentinel-ca
          - key: tls.crt
            path: redis-sentinel-cert
          - key: tls.key
            path: redis-sentinel-key
      - name: websitevolume
        persistentVolumeClaim:
          claimName: websitevolume
      - name: sslvolume
        persistentVolumeClaim:
          claimName: sslvolume
      - name: letsencryptvolume
        persistentVolumeClaim:
          claimName: letsencryptvolume
