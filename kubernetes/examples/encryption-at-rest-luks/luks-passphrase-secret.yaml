# Example LUKS passphrase Secret.
#
# This is a DEVELOPMENT placeholder. The passphrase below is public — treat it
# as a demo value, never as a production secret.
#
# For production, replace this file with a Secret provisioned by an external
# secret manager via External Secrets Operator (ESO):
#
#   - HashiCorp Vault: ESO ClusterSecretStore pointing at a Vault KV path.
#   - AWS Secrets Manager: ESO SecretStore with IRSA auth to the secret ARN.
#   - GCP Secret Manager: ESO SecretStore with Workload Identity to the secret.
#   - Azure Key Vault: ESO SecretStore with Managed Identity to the secret.
#
# The downstream manifests (openemr-deployment-luks.yaml,
# luks-format-job.yaml) reference this Secret by name only — any mechanism that
# produces a Secret of this name and key is a drop-in replacement.
#
# IMPORTANT: Losing this passphrase means the LUKS container file on NFS is
# unrecoverable. LUKS has no backdoor. Back up the passphrase in your KMS /
# password manager BEFORE running the luks-format Job.
apiVersion: v1
kind: Secret
metadata:
  name: luks-passphrase
type: Opaque
stringData:
  # Replace this value before running `luks-format-job.yaml`.
  # Minimum 20 chars with high entropy for production use. LUKS2 uses Argon2id
  # for key derivation, so the passphrase strength translates directly into
  # resistance against offline brute force on a stolen LUKS header.
  passphrase: "example-development-passphrase-REPLACE-ME"
