# OpenEMR Deployment with in-pod gocryptfs encryption-at-rest over NFS.
#
# This is a MODIFIED copy of kubernetes/openemr/deployment.yaml, with the
# following changes:
#
#   1. replicas: 3 (unchanged from default) + strategy: RollingUpdate
#      (the default stack uses strategy: Recreate, which this example
#      CHANGES to RollingUpdate).
#      gocryptfs in -sharedstorage mode safely supports concurrent mounts
#      against the same backing directory, so unlike the default stack
#      (where Recreate exists because a single new pod needs sole access
#      to the ext4 journal during startup leader election) and unlike the
#      LUKS sibling example (which must run single-replica because ext4
#      inside LUKS is single-writer), this example can preserve the
#      multi-replica topology AND flip to RollingUpdate for zero-downtime
#      rollouts. See README.md § "Concurrent-writer semantics" for the
#      exact workload caveats.
#
#   2. New native sidecar `gocryptfs-mounter` (restartPolicy: Always on an
#      initContainer). This pattern is beta/default-on since Kubernetes
#      1.29 and GA since 1.33 — on 1.29..1.32 the `SidecarContainers`
#      feature gate must remain enabled on apiserver AND kubelet
#      (which is the default). This container is PRIVILEGED (needs
#      /dev/fuse + CAP_SYS_ADMIN to fuse-mount). It:
#        - Mounts the gocryptfs backing directory on the NFS-backed
#          websitevolume via FUSE in -sharedstorage mode.
#        - Mounts the decrypted view onto a shared emptyDir with
#          Bidirectional mount propagation so the main openemr container
#          can see it.
#        - Stays alive for the pod's lifetime, holding the FUSE mount open.
#        - On SIGTERM, cleanly fusermount3 -u / umount.
#
#   3. The main `openemr` container is UNCHANGED in privilege (not privileged).
#      It mounts the shared emptyDir with HostToContainer propagation at
#      /var/www/localhost/htdocs/openemr/sites, so it transparently sees the
#      gocryptfs-decrypted view the sidecar established.
#
#   4. websitevolume is now mounted on the SIDECAR (to reach the gocryptfs
#      backing directory), NOT on the main container. The main container
#      only sees the DECRYPTED view via the emptyDir.
#
#   5. sslvolume and letsencryptvolume are UNCHANGED (plaintext on NFS).
#      Rationale: those hold TLS cert material, not PHI. Encrypting them
#      adds operational cost without improving the PHI trust boundary — an
#      attacker who can read the NFS backing already has cluster-adjacent
#      access and TLS cert exfiltration is a separate concern addressed by
#      the stack's mTLS layers and cert-manager rotation.
#
# Prerequisites:
#   - The #910 default stack is applied (kub-up).
#   - `gocryptfs-passphrase-secret.yaml` has been applied.
#   - The one-shot `gocryptfs-init-job.yaml` has completed successfully.
#   - openemr Deployment has been scaled to 0 and replaced with this one.
#
# See README.md for step-by-step adoption.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: openemr
  name: openemr
  annotations:
    # stakater/reloader: on any UPDATE to the listed Secrets (cert-manager
    # rotation triggers one), roll this Deployment so the pods pick up the
    # new certs. See kubernetes/README.md -> Certificate reload mechanism.
    secret.reloader.stakater.com/reload: "mysql-openemr-client-certs,redis-openemr-client-certs"
spec:
  # MULTI-REPLICA — gocryptfs in -sharedstorage mode safely handles
  # concurrent mounts against the same backing directory. See README.md
  # § "Concurrent-writer semantics" for the workload caveats (safe when
  # replicas write different files, which is the normal OpenEMR
  # pattern; same-file concurrent writes still require application-
  # level coordination, which OpenEMR provides via Redis session state
  # and per-upload unique filenames).
  replicas: 3
  selector:
    matchLabels:
      name: openemr
  strategy:
    # RollingUpdate — one pod rotated at a time, decrypted view stays
    # reachable through the rollout. This is a CHANGE from the default
    # stack's `strategy: Recreate`; the default picks Recreate because
    # OpenEMR's first-boot leader election writes a well-known path on
    # the shared NFS and a single new pod coming up by itself keeps
    # that race trivial. gocryptfs-over-NFS tolerates concurrent mounts
    # (via -sharedstorage) and the leader-election logic already
    # handles races, so flipping to RollingUpdate is the multi-replica
    # availability win this example buys versus the LUKS sibling.
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: openemr
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: init-mysql-wait
        image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ['sh', '-c', "until nc -z mysql-primary 3306; do echo waiting for mysql; sleep 2; done"]
      - name: init-redis-wait
        image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ['sh', '-c', "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"]
      # Native sidecar (K8s 1.29 beta / 1.33 GA): restartPolicy: Always
      # on an initContainer means this container starts before the main
      # container, runs for the pod's lifetime, and is terminated AFTER
      # the main container on shutdown. That termination order is
      # exactly what we need — the main container must stop writing to
      # /sites before we umount and tear down FUSE. On 1.29..1.32 the
      # `SidecarContainers` feature gate must remain enabled on both
      # apiserver and kubelet (it is on by default).
      - name: gocryptfs-mounter
        # Pinned to the same alpine digest as the nfs-server deployment's
        # stunnel containers (kubernetes/nfs/) so dependabot's
        # "infrastructure" group bumps them all together.
        image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
        restartPolicy: Always
        # startupProbe gates the rest of the pod on the gocryptfs mount
        # being live. Native-sidecar ordering says subsequent init
        # containers and the main containers only start after each
        # sidecar's startupProbe succeeds. Without this, the main
        # openemr container could race the sidecar's `gocryptfs`
        # fuse-mount and come up pointing at an empty emptyDir.
        #
        # The probe checks for a readiness-marker FILE written onto the
        # decrypted filesystem immediately after the mount succeeds,
        # rather than running `mountpoint`. Two reasons:
        #   1. `mountpoint` lives in util-linux and is not in the base
        #      alpine image, so until `apk add` finishes inside the
        #      setup script the probe would error out — a race window
        #      where kubelet could see the probe fail even though the
        #      sidecar is making progress. `test -f` is a shell builtin
        #      and always available.
        #   2. The marker is written INSIDE the decrypted view, so it is
        #      torn down with the FUSE mount on fusermount3 -u rather
        #      than lingering on the emptyDir after an abnormal shutdown.
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "test -f /mnt/decrypted/.gocryptfs-ready"
          periodSeconds: 2
          failureThreshold: 60
        securityContext:
          # gocryptfs mounts via FUSE: needs /dev/fuse and CAP_SYS_ADMIN
          # for fuse-mount. On most clusters this means privileged: true.
          # Scoped to this sidecar only; the main openemr container
          # remains unprivileged.
          privileged: true
        command:
        - /bin/sh
        - -c
        - |
          set -eu

          apk add --no-cache gocryptfs fuse3

          BACKING_DIR=/mnt/websitevolume/gocryptfs-backing
          DECRYPTED_MNT=/mnt/decrypted
          CONF_FILE=$BACKING_DIR/gocryptfs.conf

          if [ ! -f "$CONF_FILE" ]; then
            echo "FATAL: $CONF_FILE does not exist."
            echo "Run gocryptfs-init-job.yaml first."
            exit 1
          fi

          # Clean shutdown handler. On SIGTERM (pod termination) we
          # unmount the decrypted view so the gocryptfs process exits
          # cleanly and the NFS backing is left in a consistent state.
          # The main container has already been terminated by the
          # kubelet at this point (native sidecar termination order).
          cleanup() {
            echo "Received shutdown signal; unmounting gocryptfs"
            # fusermount3 -u is the FUSE-native unmount; if the gocryptfs
            # process has already exited or the mount is gone, treat as OK.
            fusermount3 -u "$DECRYPTED_MNT" 2>/dev/null \
              || umount "$DECRYPTED_MNT" 2>/dev/null \
              || true
            exit 0
          }
          trap cleanup TERM INT

          mkdir -p "$DECRYPTED_MNT"

          # Enable user_allow_other in fuse.conf so that the
          # -allow_other mount option below is honored — without it the
          # kernel restricts the FUSE mount to the invoking user (root
          # in this sidecar), and the main openemr container's non-root
          # Apache worker would get EACCES reading /sites. Using sed to
          # uncomment is idempotent on the stock alpine fuse3 package's
          # /etc/fuse.conf and tolerant of repeated sidecar restarts.
          # (On most kernels root-mounted FUSE honors -allow_other
          # unconditionally, but belt-and-suspenders: an explicit
          # user_allow_other avoids any cross-distro surprise.)
          if [ -f /etc/fuse.conf ]; then
            sed -i 's/^#user_allow_other/user_allow_other/' /etc/fuse.conf
          else
            echo "user_allow_other" > /etc/fuse.conf
          fi

          # Sidecar restart recovery. Native sidecars can be restarted
          # in place by the kubelet without the pod being deleted, so
          # the FUSE mount from the previous run may still be visible
          # in /proc/mounts. Three cases to distinguish:
          #
          #   1. $DECRYPTED_MNT is a live gocryptfs FUSE mount that is
          #      still readable — reuse it, skip remount. Doing an
          #      unmount here would yank a healthy mount out from under
          #      a running main container.
          #   2. $DECRYPTED_MNT is a gocryptfs FUSE mount but the
          #      backing gocryptfs process has crashed, so reads return
          #      I/O errors — unmount (fusermount3 -u) and remount
          #      cleanly.
          #   3. $DECRYPTED_MNT is NOT a FUSE mount (ext4/tmpfs/etc. —
          #      i.e. this is the raw emptyDir volume mount). LEAVE IT
          #      ALONE. gocryptfs will FUSE-mount ON TOP via its own
          #      mount(2) call, and the Bidirectional mount propagation
          #      carries that FUSE view to the main container. Unmounting
          #      the emptyDir here would detach the volume from this
          #      sidecar's mount namespace, and the subsequent gocryptfs
          #      FUSE mount would land on a non-propagated path — the
          #      main container's HostToContainer mount would still see
          #      the orphaned original emptyDir instead of the FUSE view.
          reused=0
          mount_fs=$(awk -v mnt="$DECRYPTED_MNT" '$2 == mnt { print $3 }' /proc/mounts | tail -1)
          if [ -n "$mount_fs" ]; then
            case "$mount_fs" in
              fuse|fuse.gocryptfs)
                # Confirm the mount is actually functional. A crashed
                # gocryptfs process can leave a FUSE mount visible in
                # /proc/mounts whose reads/writes return I/O error.
                if ls "$DECRYPTED_MNT" >/dev/null 2>&1; then
                  echo "Existing gocryptfs mount at $DECRYPTED_MNT is live; reusing"
                  reused=1
                else
                  echo "Existing gocryptfs mount at $DECRYPTED_MNT is non-functional; reclaiming"
                  fusermount3 -u "$DECRYPTED_MNT" 2>/dev/null \
                    || umount "$DECRYPTED_MNT" 2>/dev/null \
                    || true
                fi
                ;;
              *)
                # This is the underlying emptyDir volume mount (shows as
                # ext4/tmpfs/etc. depending on the node backing store).
                # Leave it alone — gocryptfs will FUSE-mount over it.
                echo "Emptying-dir volume mount at $DECRYPTED_MNT (type=$mount_fs); gocryptfs will FUSE-mount over it"
                ;;
            esac
          fi

          if [ "$reused" = "0" ]; then
            echo "Mounting gocryptfs: $BACKING_DIR -> $DECRYPTED_MNT"
            # -sharedstorage  : REQUIRED for concurrent multi-pod mounts.
            #                   Disables metadata caching that would make
            #                   different pods see stale directory views
            #                   when another pod writes a new file. Small
            #                   performance cost; essential for multi-
            #                   replica correctness.
            # -passfile FILE  : read passphrase from file.
            # -fg             : foreground so the process stays alive as
            #                   PID 1's child; without this gocryptfs
            #                   daemonizes and the shell exits before
            #                   `wait` sees anything to wait on.
            # -nosyslog       : logs to stderr (container log), not to
            #                   syslog (which isn't running in this
            #                   minimal container).
            # -allow_other    : by default gocryptfs restricts the FUSE
            #                   mount to the invoking user (root in the
            #                   sidecar). The main openemr container's
            #                   Apache worker runs as a non-root user and
            #                   would get EACCES on /sites reads/writes
            #                   without this flag. The user_allow_other
            #                   setup above gates the kernel into
            #                   accepting it.
            # Note on noexec: gocryptfs does not accept filesystem mount
            # options via a -o flag the way LUKS/ext4 does. If you need
            # noexec on the decrypted view, set it on the emptyDir-
            # backed mount point from the main container's side (which
            # this stack does not currently do; patches welcome).
            gocryptfs \
              -sharedstorage \
              -allow_other \
              -passfile /etc/gocryptfs/passphrase \
              -nosyslog \
              -fg \
              "$BACKING_DIR" \
              "$DECRYPTED_MNT" &
            GOCRYPTFS_PID=$!

            # Wait for the FUSE mount to actually appear in /proc/mounts.
            # gocryptfs -fg forks the FUSE kernel-side handshake before
            # fully entering its request loop; a tight race can see
            # `gocryptfs` as running but the mount not yet live.
            #
            # IMPORTANT: match on fs-type fuse / fuse.gocryptfs, not on
            # "any mount at this path". The underlying emptyDir is also
            # mounted at $DECRYPTED_MNT (kubernetes bind-mounts it in
            # before this container starts), so "$2 == mnt" is already
            # true before gocryptfs has done anything. Checking the
            # fs-type field is how we distinguish "FUSE overmount is
            # live" from "emptyDir is sitting there waiting." If we
            # accepted the emptyDir match here, the final verification
            # at the bottom of this script would catch it — but the
            # loop would exit on iteration 1, bypass the retry window,
            # and the final check would exit the sidecar before gocryptfs
            # had a chance to complete its handshake. Pod restarts would
            # not fix this (same race on every restart), so the pod
            # would never come up.
            for i in $(seq 1 50); do
              fs_type=$(awk -v mnt="$DECRYPTED_MNT" '$2 == mnt { print $3 }' /proc/mounts | tail -1)
              case "$fs_type" in
                fuse|fuse.gocryptfs)
                  echo "gocryptfs FUSE mount live after ${i}00ms (type=$fs_type)"
                  break
                  ;;
              esac
              # Bail early if gocryptfs died during handshake rather
              # than looping until failureThreshold.
              if ! kill -0 "$GOCRYPTFS_PID" 2>/dev/null; then
                echo "FATAL: gocryptfs exited during mount handshake"
                wait "$GOCRYPTFS_PID" || true
                exit 1
              fi
              sleep 0.1
            done
          fi

          # Final verification before signaling readiness: confirm
          # /mnt/decrypted is REALLY a live FUSE mount. If gocryptfs
          # silently fell back to writing into the underlying emptyDir
          # (e.g. its mount(2) failed but it kept running), the marker
          # below would land on the ext4 emptyDir and the startupProbe
          # would falsely pass — the main container would then come up
          # on UNENCRYPTED, pod-local storage. Fail closed instead.
          final_fs=$(awk -v mnt="$DECRYPTED_MNT" '$2 == mnt { print $3 }' /proc/mounts | tail -1)
          case "$final_fs" in
            fuse|fuse.gocryptfs)
              echo "Verified $DECRYPTED_MNT is a live FUSE mount (type=$final_fs)"
              ;;
            *)
              echo "FATAL: $DECRYPTED_MNT is NOT a FUSE mount (type='$final_fs')."
              echo "gocryptfs may have exited without mounting, or the mount silently failed."
              echo "/proc/mounts entries for $DECRYPTED_MNT:"
              awk -v mnt="$DECRYPTED_MNT" '$2 == mnt' /proc/mounts || true
              exit 1
              ;;
          esac

          # Readiness marker INSIDE the decrypted view. Written after
          # the mount is established AND after the fs-type verification
          # above, so the main container's startupProbe only succeeds
          # once /mnt/decrypted is really the gocryptfs mount. The
          # marker lives on the encrypted fs, so it is torn down with
          # the mount on fusermount3 -u — it cannot linger on the
          # emptyDir after an abnormal shutdown.
          : > "$DECRYPTED_MNT/.gocryptfs-ready"

          echo "gocryptfs-decrypted view is live at $DECRYPTED_MNT"

          # Wait on the gocryptfs process itself — if it crashes, the
          # sidecar exits (and the kubelet restarts it, which will go
          # through the restart-recovery path above). If we got here
          # via reuse (reused=1), we didn't spawn gocryptfs ourselves
          # so $GOCRYPTFS_PID is unset; under `set -u`, expanding it
          # would abort the sidecar and tear down the mount propagation
          # source the main container depends on. Fall back to an idle
          # wait on sleep on that path — the existing SIGTERM trap on
          # the sleep subprocess still runs cleanup cleanly.
          if [ "$reused" = "0" ]; then
            echo "Sidecar entering wait on gocryptfs PID $GOCRYPTFS_PID (will clean up on SIGTERM)"
            wait "$GOCRYPTFS_PID"
          else
            echo "Sidecar entering idle wait on reused FUSE mount (will clean up on SIGTERM)"
            sleep infinity &
            wait $!
          fi
        volumeMounts:
        - name: websitevolume
          mountPath: /mnt/websitevolume
        - name: decrypted-sites
          mountPath: /mnt/decrypted
          # Bidirectional: this container's FUSE mount at /mnt/decrypted
          # propagates OUT to the host mount namespace, from which it
          # propagates IN to the main container that mounts the same
          # emptyDir with HostToContainer propagation.
          mountPropagation: Bidirectional
        - name: gocryptfs-passphrase
          mountPath: /etc/gocryptfs
          readOnly: true
      containers:
      - env:
        - name: MYSQL_HOST
          # See kubernetes/openemr/deployment.yaml for rationale.
          value: "mysql-primary"
        - name: MYSQL_PASS
          valueFrom:
            secretKeyRef:
              name: openemr-credentials
              key: mysql-pass
        - name: MYSQL_ROOT_PASS
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: password
        - name: MYSQL_USER
          value: "openemr"
        - name: OE_PASS
          valueFrom:
            secretKeyRef:
              name: openemr-credentials
              key: admin-pass
        - name: OE_USER
          value: "admin"
        - name: SESSION_STORAGE_MODE
          value: "predis-sentinel"
        - name: REDIS_SENTINELS
          value: "sentinel-0.sentinel|||sentinel-1.sentinel|||sentinel-2.sentinel"
        - name: REDIS_MASTER
          value: "mymaster"
        - name: REDIS_SENTINELS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: default-password
        - name: REDIS_MASTER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: default-password
        - name: REDIS_TLS
          value: "yes"
        - name: REDIS_X509
          value: "yes"
        - name: REDIS_TLS_CERT_KEY_PATH
          value: "/redis-certs"
        # Synchronous Redis replication on every session write via the
        # Redis WAIT command. Matches the default deployment —
        # see kubernetes/openemr/deployment.yaml for the rationale +
        # caveats. Requires openemr 8.6.0+ (shipped in
        # openemr/openemr#15220).
        - name: REDIS_SESSION_WAIT_REPLICAS
          value: "1"
        - name: SWARM_MODE
          value: "yes"
        - name: FORCE_DATABASE_X509_CONNECT
          value: "1"
        image: openemr/openemr:8.6.0@sha256:69099754278dcb34d538e9c33c5d3e255716d73df05c2cf40ee06f247d9c4066
        name: openemr
        ports:
        - containerPort: 80
        - containerPort: 443
        resources:
          limits:
            cpu: 1000m
            memory: 1G
        startupProbe:
          exec:
            command:
            - cat
            - /root/instance-swarm-ready
          periodSeconds: 10
          # Multi-replica deployment: leader-election races through the
          # shared gocryptfs-decrypted view, same mechanism as the
          # default stack's shared NFS. 20 min matches the default
          # stack's budget.
          failureThreshold: 120
        readinessProbe:
          exec:
            command:
            - cat
            - /root/instance-swarm-ready
          initialDelaySeconds: 5
          periodSeconds: 30
        livenessProbe:
          tcpSocket:
            port: 443
          periodSeconds: 30
        volumeMounts:
        - mountPath: /root/certs/mysql/server
          name: mysql-openemr-client-certs
        - mountPath: /redis-certs
          name: redis-openemr-client-certs
        - mountPath: /var/www/localhost/htdocs/openemr/sites
          name: decrypted-sites
          # HostToContainer: see IN the mount the sidecar established in
          # the host mount namespace via its Bidirectional mount.
          mountPropagation: HostToContainer
        - mountPath: /etc/ssl
          name: sslvolume
        - mountPath: /etc/letsencrypt
          name: letsencryptvolume
      restartPolicy: Always
      volumes:
      - name: mysql-openemr-client-certs
        secret:
          secretName: mysql-openemr-client-certs
          items:
          - key: ca.crt
            path: mysql-ca
          - key: tls.crt
            path: mysql-cert
          - key: tls.key
            path: mysql-key
      - name: redis-openemr-client-certs
        secret:
          secretName: redis-openemr-client-certs
          items:
          - key: ca.crt
            path: redis-master-ca
          - key: tls.crt
            path: redis-master-cert
          - key: tls.key
            path: redis-master-key
          - key: ca.crt
            path: redis-sentinel-ca
          - key: tls.crt
            path: redis-sentinel-cert
          - key: tls.key
            path: redis-sentinel-key
      # NFS-backed websitevolume. Mounted on the sidecar only. Contains
      # the gocryptfs backing directory (gocryptfs-backing/). The main
      # container does NOT mount this directly.
      - name: websitevolume
        persistentVolumeClaim:
          claimName: websitevolume
      # emptyDir shared between the sidecar (writer, Bidirectional) and
      # the main openemr container (reader, HostToContainer). The
      # sidecar fuse-mounts the gocryptfs decrypted view HERE; the main
      # container sees that mount transparently.
      #
      # emptyDir is per-pod, cleared on pod delete. That is CORRECT
      # here: the DECRYPTED view is pod-local and ephemeral; the
      # ENCRYPTED gocryptfs-backing directory on NFS is the durable
      # artifact, shared across all replicas.
      - name: decrypted-sites
        emptyDir: {}
      - name: sslvolume
        persistentVolumeClaim:
          claimName: sslvolume
      - name: letsencryptvolume
        persistentVolumeClaim:
          claimName: letsencryptvolume
      - name: gocryptfs-passphrase
        secret:
          secretName: gocryptfs-passphrase
          defaultMode: 0400
          items:
          - key: passphrase
            path: passphrase
