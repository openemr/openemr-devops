# Example gocryptfs passphrase Secret.
#
# This is a DEVELOPMENT placeholder. The passphrase below is public — treat it
# as a demo value, never as a production secret.
#
# For production, replace this file with a Secret provisioned by an external
# secret manager via External Secrets Operator (ESO):
#
#   - HashiCorp Vault: ESO ClusterSecretStore pointing at a Vault KV path.
#   - AWS Secrets Manager: ESO SecretStore with IRSA auth to the secret ARN.
#   - GCP Secret Manager: ESO SecretStore with Workload Identity to the secret.
#   - Azure Key Vault: ESO SecretStore with Managed Identity to the secret.
#
# The downstream manifests (openemr-deployment-gocryptfs.yaml,
# gocryptfs-init-job.yaml) reference this Secret by name only — any mechanism
# that produces a Secret of this name and key is a drop-in replacement.
#
# IMPORTANT: Losing this passphrase means the gocryptfs backing directory on
# NFS is unrecoverable. gocryptfs has no backdoor. Back up the passphrase in
# your KMS / password manager BEFORE running the gocryptfs-init Job.
apiVersion: v1
kind: Secret
metadata:
  name: gocryptfs-passphrase
type: Opaque
stringData:
  # Replace this value before running `gocryptfs-init-job.yaml`.
  # Minimum 20 chars with high entropy for production use. gocryptfs uses
  # scrypt for key derivation (configurable; default N=2^16), so the
  # passphrase strength translates directly into resistance against offline
  # brute force on a stolen gocryptfs.conf.
  passphrase: "example-development-passphrase-REPLACE-ME"
