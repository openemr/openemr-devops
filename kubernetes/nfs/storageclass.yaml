apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs
provisioner: nfs.csi.k8s.io
allowVolumeExpansion: true
parameters:
  # Server is the per-node stunnel-client DaemonSet's hostPort listener.
  # kubelet does the NFS mount from the node's own loopback, which the
  # DaemonSet (hostNetwork: true) binds. Traffic is then wrapped in
  # mTLS by stunnel and forwarded to the real nfs-server pod.
  server: 127.0.0.1
  # share is /nfsshare because the ganesha EXPORT's Pseudo path is
  # /nfsshare (ganesha's pseudo-FS root is read-only and can't host
  # the csi-driver-nfs subdir provisioning, so we need to land on the
  # actual VFS-FSAL export path).
  share: /nfsshare
mountOptions:
  - nfsvers=4.1
  # Dial the per-node stunnel-client DaemonSet on its non-standard
  # loopback port (12049). Not using 2049 avoids colliding with any
  # kernel NFS server a node might already run — a silent collision
  # would send the kubelet's mount to plain NFS instead of our mTLS
  # path.
  - port=12049
  # noac + actimeo=0 disable client-side attribute caching to avoid
  # the stale-handle-poisoning behavior we hit with the previous
  # in-cluster nfs-provisioner. Costs some read perf for metadata
  # ops; acceptable for the openemr workload shape.
  - noac
  - actimeo=0
