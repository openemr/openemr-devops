apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs
provisioner: nfs.csi.k8s.io
allowVolumeExpansion: true
parameters:
  # Server is the per-node stunnel-client DaemonSet's hostPort listener.
  # kubelet does the NFS mount from the node's own loopback, which the
  # DaemonSet (hostNetwork: true) binds. Traffic is then wrapped in
  # mTLS by stunnel and forwarded to the real nfs-server pod.
  server: 127.0.0.1
  # share is /nfsshare because the ganesha EXPORT's Pseudo path is
  # /nfsshare (ganesha's pseudo-FS root is read-only and can't host
  # the csi-driver-nfs subdir provisioning, so we need to land on the
  # actual VFS-FSAL export path).
  share: /nfsshare
mountOptions:
  # NFSv4.0 (not 4.1) because ganesha's NFSv4.1 directory-delegation
  # op (OP_GET_DIR_DELEGATION) returns NFS4ERR_OP_ILLEGAL from the
  # FSAL_VFS path, which the Linux client surfaces as EREMOTEIO on
  # subsequent stat/opendir of the affected leaf dirs. NFSv4.0
  # doesn't have that op at all so the client can't ask for it.
  # See kubernetes/nfs/nfs-server-ganesha-configmap.yaml for the
  # matching server-side Minor_Versions = 0 setting.
  - nfsvers=4.0
  # Dial the per-node stunnel-client DaemonSet on its non-standard
  # loopback port (12049). Not using 2049 avoids colliding with any
  # kernel NFS server a node might already run — a silent collision
  # would send the kubelet's mount to plain NFS instead of our mTLS
  # path.
  - port=12049
  # Short client-side attribute cache. Without it (noac, actimeo=0)
  # every path lookup revalidates each directory component (sites,
  # default, documents, ...) with a GETATTR over stunnel, which made
  # ~226 NFS round trips per OpenEMR page and ~75 ms of each request;
  # it also makes every write synchronous, which is worst for the
  # encryption-at-rest examples (LUKS: a 32 MB write took 30 s;
  # gocryptfs: 688 ms per page). With a 3 s cache: 206 -> 133 ms per
  # page on the default stack, 188 -> 145 ms on LUKS, 688 -> 246 ms on
  # gocryptfs (4-node kind).
  # Still correct across pods: open() revalidates the file
  # (close-to-open), so file contents written by one pod are seen by
  # the next open in another; only stat-only checks and directory
  # listings can be up to 3 s stale. openemr's swarm leader claim is
  # an O_EXCL create, which the NFS server decides, so the cache
  # cannot produce two leaders. noac/actimeo=0 were originally added
  # for stale-handle poisoning with the previous nfs-provisioner;
  # that does not recur with csi-driver-nfs + ganesha (cert/CA
  # rotation, NFS server restart and a 60 s outage all pass with
  # caching on).
  - actimeo=3
  # Cache only positive lookups. A "file does not exist" answer is
  # always re-asked, so a pod sees a newly created file (for example
  # sites/docker-completed at the end of first-boot setup)
  # immediately rather than up to 3 s later.
  - lookupcache=positive
