apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: phpmyadmin
  name: phpmyadmin
  annotations:
    # stakater/reloader: on any UPDATE to the listed Secrets (cert-manager
    # rotation triggers one), roll this Deployment so the pods pick up the
    # new certs. See kubernetes/README.md -> Certificate reload mechanism.
    secret.reloader.stakater.com/reload: "phpmyadmin-server-certs,mysql-phpmyadmin-client-certs,openemr-ca-bundle"
spec:
  replicas: 1
  selector:
    matchLabels:
      name: phpmyadmin
  template:
    metadata:      
      labels:
        name: phpmyadmin
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PMA_HOSTS
          # See kubernetes/openemr/deployment.yaml for the rationale
          # on mysql-primary vs the old `mysql` Service name.
          value: mysql-primary
        image: phpmyadmin:5.2.3@sha256:f54a37b908b26caa7032c4eb0c7f3495fdd90208a06eed9c4b2c8e691dd1662c
        name: phpmyadmin
        command: ["/wrapper.sh"]
        volumeMounts:
        - name: phpmyadmin-server-certs
          mountPath: /certs
        # File by file with subPath: see the redis-certs mounts in
        # openemr/deployment.yaml (PHP realpath cache vs live Secret update).
        - name: mysql-phpmyadmin-client-certs
          mountPath: /etc/mysql/ca.pem
          subPath: ca.pem
        - name: mysql-phpmyadmin-client-certs
          mountPath: /etc/mysql/tls.crt
          subPath: tls.crt
        - name: mysql-phpmyadmin-client-certs
          mountPath: /etc/mysql/tls.key
          subPath: tls.key
        - name: phpmyadmin-config-map
          mountPath: /etc/phpmyadmin/config.user.inc.php
          subPath: config.user.inc.php
        - name: phpmyadmin-config-map
          mountPath: /etc/apache2/sites-enabled/000-default.conf
          subPath: 000-default.conf
        - name: phpmyadmin-config-map
          mountPath: /wrapper.sh
          subPath: wrapper.sh
        ports:
        - containerPort: 80
        - containerPort: 443
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:  
            cpu: 100m       
            memory: 100Mi
          limits:
            cpu: 500m
            memory: 2G
      volumes:
      - name: phpmyadmin-server-certs
        secret:
          secretName: phpmyadmin-server-certs
          items:
          - key: ca.crt
            path: ca.crt
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      - name: mysql-phpmyadmin-client-certs
        projected:
          sources:
          # ca.crt (trust anchors) comes from the trust-manager Bundle target
          # (certs/ca-bundle.yaml), not the leaf Secret, so a CA rotation can
          # trust the old and new CA at the same time. See kubernetes/README.md
          # -> CA rotation.
          - secret:
              name: openemr-ca-bundle
              items:
              - key: ca.crt
                path: ca.pem
          - secret:
              name: mysql-phpmyadmin-client-certs
              items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              # To downgrade to tls (no client certs): remove tls.crt and tls.key items above
      - name: phpmyadmin-config-map
        configMap:
          name: phpmyadmin-configmap
          defaultMode: 0744