# A throwaway OpenEMR for the openemr-doctor smoke test (.github/workflows/test-openemr-doctor.yml),
# with sites/ on a volume as in OpenEMR's compose files. OPENEMR_TAG picks the image (default latest).
# Demo credentials only.
name: openemr-doctor-test
services:
  mysql:
    image: mariadb:11.8
    environment:
      MYSQL_ROOT_PASSWORD: root
    command: ['mariadbd', '--character-set-server=utf8mb4']
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh', '--su-mysql', '--connect', '--innodb_initialized']
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
    mem_limit: 2g
  openemr:
    image: openemr/openemr:${OPENEMR_TAG:-latest}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - sitevolume:/var/www/localhost/htdocs/openemr/sites
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      OE_USER: admin
      OE_PASS: pass
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs -o /dev/null http://localhost/interface/login/login.php?site=default']
      start_period: 10m
      start_interval: 10s
      interval: 1m
      timeout: 5s
    mem_limit: 3g
volumes:
  sitevolume: {}
